name: Vocabulary prediction evaluation
on:
  pull_request:
    paths:
      - 'app/web/assets/prediction.js'
      - 'tools/evaluate_prediction.cjs'
      - 'tests/evaluate_prediction.test.cjs'
      - '.github/workflows/prediction-evaluation.yml'
jobs:
  score:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/evaluate_prediction.test.cjs
