name: Video catalog
on:
  pull_request:
    paths:
      - 'app/video_catalog.py'
      - 'app/server.py'
      - 'app/annotate.py'
      - 'app/web/assets/app.js'
      - 'tools/build_site.py'
      - 'tests/test_video_catalog.py'
      - '.github/workflows/video-catalog.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install srt numpy
      - run: python -X warn_default_encoding -W error::EncodingWarning tests/test_video_catalog.py -v
