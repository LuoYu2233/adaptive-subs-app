name: Offline adaptive word test
on:
  pull_request:
    paths:
      - 'tools/cat/**'
      - 'tools/build_cat_pilot.cjs'
      - 'app/data/vocab_test.json'
      - 'tests/cat_word_pilot.test.cjs'
      - 'tests/check_cat_page.py'
      - '.github/workflows/cat-word-pilot.yml'
permissions:
  contents: read
jobs:
  trial:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/cat_word_pilot.test.cjs
      - run: python -m pip install playwright==1.65.2
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python tests/check_cat_page.py
