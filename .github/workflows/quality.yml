name: Offline quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/quality_check.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-results
          path: test-results/browser/
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_instance_lock.py tests/test_startup.py
      - run: python tools/instance_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instance-check-${{ matrix.os }}
          path: test-results/instance/
