name: Word difficulty table
on:
  pull_request:
    paths:
      - 'tools/build_word_difficulty.py'
      - 'app/data/exam_words.json'
      - 'tests/test_word_difficulty.py'
      - 'tests/check_generated_word_table.py'
      - 'app/data/vocab_test.json'
      - '.github/workflows/word-difficulty.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python tests/test_word_difficulty.py -v
      - run: python -m pip install wordfreq==3.1.1 spacy==3.8.18 https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - run: python tools/build_word_difficulty.py
      - name: Verify full-table coverage and export its fingerprint
        shell: bash
        run: python tests/check_generated_word_table.py > table-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: table-hash-${{ runner.os }}
          path: table-sha256.txt
          retention-days: 1
  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: table-hash-*
      - name: Check that Windows and Linux produced the same table
        run: |
          diff -u --strip-trailing-cr table-hash-{Linux,Windows}/table-sha256.txt
          cat table-hash-Linux/table-sha256.txt
