name: Windows offline feedback calibrator
on:
  pull_request:
    paths:
      - 'tools/windows_calibrator.py'
      - 'tools/fit_viewing_feedback.py'
      - 'tools/viewing/**'
      - 'tests/check_windows_calibrator.py'
      - '.github/workflows/windows-calibrator.yml'
permissions:
  contents: read
jobs:
  windows-calibrator:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r tools/viewing/requirements.txt pyinstaller
      - name: Exercise the native form, output and error recovery
        run: python -X warn_default_encoding -W error::EncodingWarning tests/check_windows_calibrator.py
      - name: Build the portable offline executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name AdaptiveSubs-Calibration tools/windows_calibrator.py
      - name: Launch and close the distributed Windows window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/AdaptiveSubs-Calibration.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(100)
            do {
              $window = Get-Process -Name 'AdaptiveSubs-Calibration' -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq 'Adaptive Subs · 观看反馈校准' } | Select-Object -First 1
              if ($window) { break }
              if ($p.HasExited) { throw "Calibrator exited before opening its window." }
              Start-Sleep -Milliseconds 300
            } while ([DateTime]::UtcNow -lt $deadline)
            if (!$window -or !$window.CloseMainWindow() -or !$p.WaitForExit(20000) -or $p.ExitCode -ne 0) {
              throw "The native calibration window did not start and close cleanly."
            }
          } finally {
            if (!$p.HasExited) { $p.Kill($true) }
            $p.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AdaptiveSubs-Windows-Calibration
          path: dist/AdaptiveSubs-Calibration.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
