name: Offline trial material archive
on:
  pull_request:
    paths:
      - 'tools/build_trial_materials.py'
      - 'packaging/trial/**'
      - 'tests/test_trial_materials.py'
      - '.github/workflows/trial-materials.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X warn_default_encoding -W error::EncodingWarning tests/test_trial_materials.py -v
