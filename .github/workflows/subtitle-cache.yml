name: Subtitle result cache
on:
  pull_request:
    paths:
      - 'app/annotate.py'
      - 'app/server.py'
      - 'app/web/assets/app.js'
      - 'tests/check_saved_navigation.py'
      - 'app/result_validation.py'
      - 'app/storage.py'
      - 'app/subtitle_store.py'
      - 'tests/test_subtitle_store.py'
      - '.github/workflows/subtitle-cache.yml'
permissions:
  contents: read
jobs:
  cache:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install srt numpy
      - run: python -X warn_default_encoding -W error::EncodingWarning tests/test_subtitle_store.py -v
      - run: python -m pip install playwright==1.65.2
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python tests/check_saved_navigation.py
