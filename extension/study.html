<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词观看记录 · Adaptive Subs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#202b23;font:17px/1.6 "Microsoft YaHei",system-ui,sans-serif}
main{max-width:43rem;margin:clamp(1rem,7vh,4rem) auto;padding:clamp(1rem,5vw,3rem);background:white;border:1px solid #c5cdc6;border-radius:12px}
h1{margin:0}label{display:block;margin:.8rem 0 .2rem}input,button{font:inherit;max-width:100%;padding:.35rem .65rem}button{cursor:pointer}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0}button:focus-visible,input:focus-visible{outline:3px solid #996d12}#error{color:#882c23}
</style></head><body><main><h1>单词观看记录</h1>
<p>试用 IRT 时，可自愿为当前视频记录哪些候选词实际出现在屏幕上、显示了哪些释义，以及你查词或标记的操作。记录只保存在此浏览器，可随时停止、导出或删除。</p>
<p>导出文件含词元、字幕位置、显示状态、模型概率、时间、可识别相同字幕的内容指纹和下面的两个代号。请选择没有个人信息的代号。</p>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<form id="form" hidden><label for="clip">片段代号（例如 clip01）</label><input id="clip" required maxlength="32" autocomplete="off">
<label for="domain">视频领域（例如 科技）</label><input id="domain" required maxlength="32" autocomplete="off">
<p>两个代号均可使用汉字、字母、数字、短横线和下划线。返回原视频并播放即可开始积累记录。刷新、切换视频或更换模型会结束本次记录。</p>
<button id="begin">为当前视频开始记录</button></form>
<div class="actions"><button id="stop" hidden>停止记录</button><button id="export" hidden>导出 JSON</button><button id="clear" hidden>清除本机记录</button></div>
<script src="study-page.js"></script></main></body></html>
